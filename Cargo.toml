[package]
name = "hypr_center"
version = "0.1.0"
edition = "2024"
description = "A system setting application for Hyrpland"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hyprland = "0.3.13"
slint = "1.18.1"
tokio = "1.53.3"
zbus = "5.19.0"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = true

[[bin]]
name = "HyprCenter"
path = "src/main.rs"
